name: Lernpfad aktualisieren

on:
  push:
    branches: [main]
    paths:
      - "[0-9][0-9]_*/**"
      - "tools/build_lernpfad.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lernpfad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lernpfad erzeugen
        run: python tools/build_lernpfad.py

      - name: Änderungen committen
        run: |
          if [[ -n "$(git status --porcelain LERN_PFAD.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LERN_PFAD.md
            git commit -m "docs: Lernpfad automatisch aktualisiert"
            git push
          else
            echo "Nichts zu committen."
          fi